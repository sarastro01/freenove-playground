[env:freenove-fnk0114n-sensor-pages]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyUSB1
upload_speed = 921600
upload_port = /dev/ttyUSB1

lib_extra_dirs =
  ../lib/Freenove

lib_deps =
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/Adafruit TSL2591 Library @ ^1.4.5
  adafruit/Adafruit SI1145 Library @ ^1.2.0
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit seesaw Library @ ^1.7.9
  adafruit/Adafruit DS248x @ ^1.2.0
  paulstoffregen/OneWire @ ^2.3.8
  sparkfun/SparkFun SCD30 Arduino Library @ ^1.0.20
  sparkfun/SparkFun VEML6075 Arduino Library @ ^1.1.5
  adafruit/Adafruit VEML6070 Library @ ^1.0.8

build_flags =
  -Iinclude
  -D USER_SETUP_LOADED
  -include include/User_Setup.h

src_filter =
  +<*> +<../lib/> -<../test/> -<sensors/GamepadSensor.cpp> -<sensors/EncoderSensor.cpp>
